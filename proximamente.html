<style>
  :root{
    --carbon:#0f0d0b; --carbon-2:#161311;
    --crema:#f4eddc; --crema-2:#d9cfb6; --crema-3:#a89e88;
    --verde:#70bf44; --oro:#c9a35a; --oro-2:#e6c987; --oro-3:#8f6f33;
    --serif:'Cormorant Garamond','Times New Roman',Georgia,serif;
    --sans:'Manrope','Segoe UI',system-ui,-apple-system,sans-serif;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; min-height:100svh; background:var(--carbon); color:var(--crema);
    font-family:var(--sans); display:flex; align-items:center; justify-content:center;
    overflow:hidden; position:relative; isolation:isolate;
  }

  /* Resplandor de fondo, calcado del hero de la web */
  .glow{
    position:absolute; inset:0; z-index:-2;
    background:
      radial-gradient(55% 50% at 50% 68%, rgba(232,98,31,.22), transparent 70%),
      radial-gradient(40% 40% at 60% 78%, rgba(112,191,68,.08), transparent 70%),
      linear-gradient(180deg,#0f0d0b 0%,#14110e 100%);
    animation:breathe 7s ease-in-out infinite alternate;
  }
  @keyframes breathe{ 0%{opacity:.85} 100%{opacity:1} }

  /* Grano, calcado del brand book */
  .grain{
    position:absolute; inset:0; z-index:-1; opacity:.05; pointer-events:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    mix-blend-mode:overlay;
  }

  .stage{position:relative; z-index:2; max-width:760px; padding:0 1.5rem; text-align:center}

  .reveal{opacity:0; transform:translateY(16px); animation:revealUp 1s var(--ease) forwards}
  @keyframes revealUp{ to{opacity:1; transform:translateY(0)} }

  .logo{
    width:clamp(150px,38vw,190px); margin:0 auto 1.4rem; display:block; opacity:.97;
    animation-delay:.1s;
  }
  .eyebrow{
    font-family:var(--sans); font-size:.72rem; font-weight:700; letter-spacing:.28em;
    text-transform:uppercase; color:var(--verde); margin:0 0 1.6rem;
    display:flex; align-items:center; justify-content:center; gap:.75rem;
    animation-delay:.55s;
  }
  .eyebrow::before,.eyebrow::after{ content:""; width:26px; height:1px; background:currentColor; opacity:.8 }

  .line1,.line2{
    font-family:var(--serif); font-weight:500; color:var(--crema);
    font-size:clamp(1.5rem,4vw,2.35rem); line-height:1.4; margin:0;
  }
  .line1{ animation-delay:.85s }
  .line2{ animation-delay:1.1s }

  .line3{
    font-family:var(--serif); font-style:italic; font-weight:600; color:var(--verde);
    font-size:clamp(2rem,5.6vw,3.4rem); line-height:1.3; margin:1.4rem 0 .7rem;
    animation-delay:1.45s;
  }
  .line4{
    font-family:var(--sans); color:var(--crema-3);
    font-size:clamp(.85rem,2vw,1.02rem); letter-spacing:.02em; margin:0;
    animation-delay:1.75s;
  }

  .ig{
    font-family:var(--sans); font-size:.78rem; letter-spacing:.16em; text-transform:uppercase;
    color:var(--crema-3); text-decoration:none; border-bottom:1px solid rgba(244,237,220,.25);
    padding-bottom:.35rem; transition:color .3s,border-color .3s;
    animation-delay:2.3s;
  }
  .ig:hover{ color:var(--verde); border-color:var(--verde) }

  /* Brasas, calcadas del efecto de la web */
  .embers{position:absolute; inset:0; z-index:0; pointer-events:none; overflow:hidden}
  .embers i:not(.smoke):not(.spark){
    position:absolute; bottom:-10px; left:var(--x);
    width:var(--s); height:var(--s); border-radius:50%;
    background:radial-gradient(circle,#fff3d6 0%,#ffd39a 22%,#ff7a2a 55%,transparent 75%);
    box-shadow:0 0 calc(var(--s) * 2.6) calc(var(--s) * .4) rgba(255,140,60,.55);
    opacity:0; filter:blur(.3px);
    animation:ember var(--t) ease-in-out var(--delay) infinite, ember-twinkle var(--tw) ease-in-out calc(var(--delay) * .4) infinite;
  }
  .embers i:not(.smoke):not(.spark):nth-of-type(3n){
    background:radial-gradient(circle,#fff8e6 0%,#ffe6b8 22%,#ffb020 55%,transparent 75%);
    box-shadow:0 0 calc(var(--s) * 2.6) calc(var(--s) * .4) rgba(255,176,32,.5);
  }
  .embers i:not(.smoke):not(.spark):nth-of-type(4n){
    background:radial-gradient(circle,#ffe9d6 0%,#ffb38a 22%,#e8621f 55%,transparent 75%);
    box-shadow:0 0 calc(var(--s) * 2.6) calc(var(--s) * .4) rgba(232,98,31,.5);
  }
  .embers i:not(.smoke):not(.spark):nth-of-type(5n){
    background:radial-gradient(circle,#ffdccb 0%,#ff8a65 22%,#d1261f 55%,transparent 75%);
    box-shadow:0 0 calc(var(--s) * 2.6) calc(var(--s) * .4) rgba(209,38,31,.45);
  }
  @keyframes ember{
    0%{transform:translate3d(0,0,0) scale(.85); opacity:0}
    8%{opacity:var(--o)}
    22%{transform:translate3d(calc(var(--dx) * .35),-22vh,0) scale(1); opacity:calc(var(--o) * .55)}
    38%{transform:translate3d(calc(var(--dx) * -.15),-40vh,0) scale(.92); opacity:var(--o)}
    55%{transform:translate3d(calc(var(--dx) * .55),-60vh,0) scale(.8); opacity:calc(var(--o) * .6)}
    72%{transform:translate3d(calc(var(--dx) * .2),-80vh,0) scale(.6); opacity:var(--o)}
    100%{transform:translate3d(calc(var(--dx) * 1.4),-108vh,0) scale(.15); opacity:0}
  }
  @keyframes ember-twinkle{
    0%,100%{filter:blur(.3px) brightness(1)}
    50%{filter:blur(.3px) brightness(1.5)}
  }
  .embers i.smoke{
    position:absolute; bottom:-20px; left:var(--x);
    width:var(--s); height:var(--s); border-radius:50%;
    background:radial-gradient(circle,rgba(224,216,205,.65) 0%,rgba(216,208,198,.22) 45%,transparent 72%);
    filter:blur(7px); opacity:0;
    animation:humo var(--t) ease-out var(--delay) infinite;
  }
  @keyframes humo{
    0%{transform:translate3d(0,0,0) scale(.6); opacity:0}
    12%{opacity:var(--o)}
    55%{transform:translate3d(calc(var(--dx) * .6),-55vh,0) scale(1.5); opacity:calc(var(--o) * .6)}
    100%{transform:translate3d(var(--dx),-95vh,0) scale(2.2); opacity:0}
  }
  .embers i.spark{
    position:absolute; bottom:6%; left:var(--x);
    width:var(--s); height:var(--s); border-radius:50%;
    background:radial-gradient(circle,#fffdf5 0%,#ffe08a 35%,#ff7a2a 65%,transparent 80%);
    box-shadow:0 0 9px 2px rgba(255,190,90,.9); opacity:0;
    animation:chispa var(--t) ease-out var(--delay) infinite;
  }
  @keyframes chispa{
    0%{transform:translate3d(0,0,0) scale(.4); opacity:0}
    8%{transform:translate3d(calc(var(--dx) * .2),calc(var(--rise) * -.3),0) scale(1); opacity:1}
    35%{transform:translate3d(calc(var(--dx) * .6),calc(var(--rise) * -.7),0) scale(.7); opacity:.85}
    70%{transform:translate3d(var(--dx),calc(var(--rise) * -1),0) scale(.3); opacity:.3}
    100%{transform:translate3d(var(--dx),calc(var(--rise) * -1.15),0) scale(0); opacity:0}
  }

  .foot{position:absolute; bottom:clamp(1.5rem,4vw,2.6rem); left:0; right:0; z-index:2; display:flex; justify-content:center}

  @media (max-width:560px){
    .stage{padding:0 1.1rem}
    .line1,.line2{font-size:1.3rem}
    .foot{bottom:1.3rem}
  }

  @media (prefers-reduced-motion:reduce){
    .reveal{animation:none!important; opacity:1!important; transform:none!important}
    .glow{animation:none!important}
    .embers i{animation:none!important; opacity:.5!important}
  }
</style>

<script>
(function(){
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var embers = document.getElementById('embers');
  if (!embers || reduceMotion) return;
  var n = window.innerWidth < 700 ? 14 : 28;
  var frag = document.createDocumentFragment();
  for (var i = 0; i < n; i++) {
    var s = document.createElement('i');
    var size = Math.random() * 5 + 2;
    var slowdown = .8 + (size - 2) / 5 * .7;
    s.style.setProperty('--x', (Math.random() * 100).toFixed(2) + '%');
    s.style.setProperty('--s', size.toFixed(1) + 'px');
    s.style.setProperty('--t', ((Math.random() * 8 + 7) * slowdown).toFixed(1) + 's');
    s.style.setProperty('--delay', (-Math.random() * 18).toFixed(1) + 's');
    s.style.setProperty('--tw', (Math.random() * 1.4 + .6).toFixed(2) + 's');
    s.style.setProperty('--dx', ((Math.random() - .5) * 130).toFixed(0) + 'px');
    s.style.setProperty('--o', (Math.random() * .5 + .4).toFixed(2));
    frag.appendChild(s);
  }
  embers.appendChild(frag);

  var smokeN = window.innerWidth < 700 ? 3 : 6;
  var smokeFrag = document.createDocumentFragment();
  for (var j = 0; j < smokeN; j++) {
    var sm = document.createElement('i');
    sm.className = 'smoke';
    sm.style.setProperty('--x', (Math.random() * 80 + 10).toFixed(2) + '%');
    sm.style.setProperty('--s', (Math.random() * 50 + 55).toFixed(0) + 'px');
    sm.style.setProperty('--t', (Math.random() * 10 + 16).toFixed(1) + 's');
    sm.style.setProperty('--delay', (-Math.random() * 24).toFixed(1) + 's');
    sm.style.setProperty('--dx', ((Math.random() - .5) * 90).toFixed(0) + 'px');
    sm.style.setProperty('--o', (Math.random() * .1 + .1).toFixed(2));
    smokeFrag.appendChild(sm);
  }
  embers.appendChild(smokeFrag);

  var sparkN = window.innerWidth < 700 ? 8 : 16;
  var sparkFrag = document.createDocumentFragment();
  for (var k = 0; k < sparkN; k++) {
    var sp = document.createElement('i');
    sp.className = 'spark';
    sp.style.setProperty('--x', (Math.random() * 100).toFixed(2) + '%');
    sp.style.setProperty('--s', (Math.random() * 2.2 + 1.8).toFixed(1) + 'px');
    sp.style.setProperty('--t', (Math.random() * .7 + .5).toFixed(2) + 's');
    sp.style.setProperty('--delay', (-Math.random() * 6).toFixed(1) + 's');
    sp.style.setProperty('--dx', ((Math.random() - .5) * 40).toFixed(0) + 'px');
    sp.style.setProperty('--rise', (Math.random() * 18 + 8).toFixed(0) + 'vh');
    sparkFrag.appendChild(sp);
  }
  embers.appendChild(sparkFrag);
})();
</script>
